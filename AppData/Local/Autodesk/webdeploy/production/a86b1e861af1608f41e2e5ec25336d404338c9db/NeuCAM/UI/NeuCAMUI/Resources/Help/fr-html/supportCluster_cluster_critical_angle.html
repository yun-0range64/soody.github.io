<div id="supportCluster_cluster_critical_angle"><p>Les zones des triangles orientés vers le bas dont l'angle est au moins aussi éloigné de l'axe horizontal doivent au minimum faire l'objet d'un support. Ajustez cette option afin de répondre aux exigences relatives à la machine et à la matière.</p>
<p>La valeur doit être comprise entre 0 et 90 deg.</p>
