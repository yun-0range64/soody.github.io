<div id="allowPlungingOutsideStock"><p>Au lieu d'usiner le matériau à l'intérieur du contour d'une zone sélectionnée, l'activation de ce paramètre permet de retirer le matériau à l'extérieur du contour sélectionné en choisissant un contour de brut supplémentaire.</p>
<p>Désactivez ce paramètre pour forcer la plongée en rampe dans le brut.</p>
