<div id="supportPropertyBar_bar_smooth_distance"><p>Permet de définir la longueur des sous-divisions qui forment la courbe. Plus la section est courte, plus la courbe est résolue précisément, créant ainsi une transition plus lissée mais également davantage de triangles.</p>
<p>La valeur doit être comprise entre 0,5 et 100 mm.</p>
