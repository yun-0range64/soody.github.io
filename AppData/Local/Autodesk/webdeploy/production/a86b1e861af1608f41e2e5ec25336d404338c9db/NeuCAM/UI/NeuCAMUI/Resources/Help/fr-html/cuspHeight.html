<div id="cuspHeight"><p>La <b>hauteur de crête</b> est la finition de surface théorique produite par le rayon de l'outil au cours des trajectoires d'outil successives. Plus le diamètre de l'outil est petit ou plus le recouvrement est grand, plus la hauteur de crête est importante.</p>
