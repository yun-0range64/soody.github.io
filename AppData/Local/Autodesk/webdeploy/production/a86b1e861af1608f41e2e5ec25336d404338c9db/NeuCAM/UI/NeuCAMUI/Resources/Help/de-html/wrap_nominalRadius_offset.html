<div id="wrap_nominalRadius_offset"><p>Wenn Sie die Aufbringungsoperation durchführen, kann der Werkzeugweg nur bei einem Radius präzise sein: dem <b>Aufbringungsradius</b>, der vorgabemäßig dem Radius des ausgewählten Aufbringungszylinders entspricht. Dieser Versatz ermöglicht es Ihnen, den Aufbringungsradius anzupassen.</p>
</div>
