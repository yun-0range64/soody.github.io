<div id="wrap_nominalRadius_value"><p>Wenn Sie die Aufbringungsoperation durchführen, kann der Werkzeugweg nur bei einem Radius präzise sein. Dies ist der Radius, an dem die Aufbringungsoperation durchgeführt wird.</p>
<p>Jede Wand unterhalb dieses Radius wird überschnitten, und jede Wand oberhalb dieses Radius wird unterschnitten.</p>
</div>
