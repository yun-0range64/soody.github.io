<div id="inspectUpperTolerance"><p>Limite supérieure de la bande de tolérance.</p>
<p>La bande de tolérance est la valeur de déviation acceptable par rapport à la valeur nominale. Si un point se situe au-dessus ou au-dessous de cette bande, il est considéré comme en dehors des limites de tolérance.</p>
</div>
