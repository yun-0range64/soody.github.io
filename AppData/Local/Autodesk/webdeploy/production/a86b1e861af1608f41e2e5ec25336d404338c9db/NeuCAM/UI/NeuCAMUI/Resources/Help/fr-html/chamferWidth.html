<div id="chamferWidth"><p>Largeur du chanfrein.</p>
<p>Pour les arêtes qui ne sont pas déjà chanfreiné, cette valeur représente la largeur finale du chanfrein.</p>
<p>Pour les arêtes chanfreinées, il s'agit d'un décalage supplémentaire. Cette mesure revient à utiliser une valeur de surépaisseur radiale négative.</p>
