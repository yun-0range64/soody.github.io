<div id="restMaterialAdjustmentOffset"><p>Ce paramètre indique la quantité supplémentaire de brut à ignorer ou à supprimer, selon le réglage du paramètre Ajustement reprise.</p>
<p>Il est surtout utilisé pour éviter d'usiner de petites quantités de matière restante lorsque le paramètre Ignorer les dentelures est utilisé.</p>
</div>
