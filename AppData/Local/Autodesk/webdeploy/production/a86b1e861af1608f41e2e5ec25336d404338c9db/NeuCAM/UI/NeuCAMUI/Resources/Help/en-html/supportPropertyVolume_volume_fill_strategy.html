<div id="supportPropertyVolume_volume_fill_strategy"><p>Defines in which directions the outer contours of the volume supports is filled: In both X and Y direction, just in Y, or no filling at all.</p>
<ul>
<li>The equivalent of <em>Just in X</em> can be created by using <em>Just in Y</em> and setting <em>Rotate by Z</em> to 90 &deg;.</li>
<li>Not available for Hollow-type filling.</li>
</ul>
</div>
