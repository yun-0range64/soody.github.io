<div id="supportGeneral_baseplate_offset"><p>Détermine la marge pour générer le contour de la plaque de base. La marge est ajoutée à la zone ombrée de la pièce ainsi qu'aux contours des structures de support de volume solide, au niveau de leur limite sur la plate-forme de construction.</p>
<p>La valeur doit être comprise entre -500 mm et 500 mm.</p>
