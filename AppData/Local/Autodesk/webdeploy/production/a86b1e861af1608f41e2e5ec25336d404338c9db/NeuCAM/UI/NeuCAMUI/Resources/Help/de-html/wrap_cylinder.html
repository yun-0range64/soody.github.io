<div id="wrap_cylinder"><p>Der Zylinder, um den der Werkzeugweg aufgebracht wird.</p>
<p>Für die Achsenersetzung muss diese entlang der Rotationsachse der Maschine verlaufen.</p>
<p>Für Multi-Achsen kann dies eine beliebige Achse sein, solange die resultierenden Werkzeugwegpositionen von der Maschine erreicht werden können.</p>
