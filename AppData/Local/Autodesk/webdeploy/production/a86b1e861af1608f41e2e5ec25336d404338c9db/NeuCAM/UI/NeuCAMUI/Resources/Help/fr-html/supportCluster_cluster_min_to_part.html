<div id="supportCluster_cluster_min_to_part"><p>La zone projetée vers le bas d'un regroupement détecté doit uniquement être empiétée par un autre maillage (pièce identique ou différente) selon une valeur spécifiée dans cette plage. Sinon, elle sera ignorée pour l'action de support correspondante.</p>
<p>La valeur doit être comprise entre 0 et 100.</p>
