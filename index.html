
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <title>SOODY | 수어 학습</title>

  <link rel="stylesheet" href="./mobile.css" />
</head>

<body>
  <main class="app">

    <!-- 상단 학습 영역 -->
    <section class="learning-section">

      <!-- 앱 내부 상태바 -->
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span>●  Wi-Fi  ▰</span>
      </div>

      <!-- 진행률 -->
      <header class="progress-header">
        <button
          class="close-button"
          type="button"
          aria-label="학습 종료"
        >×</button>

        <div
          class="progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="3"
          aria-valuenow="1"
        >
          <div class="progress-fill"></div>
        </div>

        <span class="progress-count">1/3</span>
      </header>

      <h1 class="learning-title">
        새로운 수어를 배워볼까요?
      </h1>

      <!-- 튜터 -->
      <div class="tutor-area">
        <img
          class="tutor-image"
          src="./assets/sign-tutor.png"
          alt="수어 동작을 보여주는 튜터"
        />

        <div class="tutor-message">
          <span>
            <strong>만나서</strong> 반갑습니다.
          </span>
        </div>
      </div>
    </section>

    <!-- 하단 실시간 카메라 -->
    <section class="camera-section" aria-label="수어 연습 카메라">

      <video
        id="cameraVideo"
        class="camera-video"
        autoplay
        muted
        playsinline
      ></video>

      <canvas
        id="handCanvas"
        class="hand-canvas"
      ></canvas>

      <div class="home-indicator" aria-hidden="true"></div>
    </section>

  </main>

  <script src="./mobile.js"></script>
</body>
</html>
